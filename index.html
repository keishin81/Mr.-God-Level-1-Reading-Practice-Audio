<title>Mr. God からの挑戦状 Level 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{
  --bg:#F6F8FB; --surface:#FFFFFF; --ink:#1B2433; --muted:#667085; --line:#DDE3EC;
  --accent:#2B59C3; --accent-ink:#FFFFFF; --tint:#EAF0FA; --now:#FFF4D6; --now-line:#E0B53A;
  --en:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --ja:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151E; --surface:#171E2A; --ink:#E6EBF3; --muted:#98A2B3; --line:#2A3445;
    --accent:#7FA3F0; --accent-ink:#0E1522; --tint:#1C2740; --now:#33301F; --now-line:#C9A23A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151E; --surface:#171E2A; --ink:#E6EBF3; --muted:#98A2B3; --line:#2A3445;
  --accent:#7FA3F0; --accent-ink:#0E1522; --tint:#1C2740; --now:#33301F; --now-line:#C9A23A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ja);font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{padding-block:28px 12px}
header.top h1{font-size:24px;margin:0;letter-spacing:.02em;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--muted);font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button,.tog{font:inherit;font-size:13px;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn:focus-visible,select:focus-visible,.play:focus-visible,.tog input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 9px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tog{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.tog input{accent-color:var(--accent)}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:100%}
h2.ch{font-size:19px;margin:36px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--ink);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2.ch .no{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:.04em}
h2.ch .cplay{margin-left:auto}
.grp{margin-top:18px}
.gh{display:flex;align-items:center;gap:10px;background:var(--tint);border-left:4px solid var(--accent);padding:5px 10px;font-weight:700;font-size:14px}
.gh span{flex:1}
.gh .btn{padding:3px 10px;font-size:12px;font-weight:400}
ol.ss{list-style:none;margin:0;padding:0}
.s{display:grid;grid-template-columns:36px 3.2em 1fr;gap:4px 8px;align-items:start;padding:10px 6px;border-bottom:1px solid var(--line);border-radius:4px}
.s.now{background:var(--now);box-shadow:inset 3px 0 0 var(--now-line)}
.play{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0}
.play svg{width:14px;height:14px;fill:currentColor}
.s.now .play{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.s.cont{border-top:0}
.num{font-family:var(--en);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:5px}
.en{white-space:pre-line;font-family:var(--en);font-size:17px;line-height:1.5;padding-top:3px;overflow-wrap:anywhere}
.ja{display:none;white-space:pre-line;grid-column:3;font-size:13px;color:var(--muted)}
body.hide-en .en{color:transparent;background:var(--line);border-radius:3px;cursor:pointer}
body.hide-ja .ja{color:transparent;background:var(--line);border-radius:3px;cursor:pointer}
body.hide-en .s.reveal-en .en,body.hide-ja .s.reveal-ja .ja{color:inherit;background:none}
body.hide-ja .s.reveal-ja .ja{color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin-top:32px}
@media (max-width:520px){ .en{font-size:16px} .s{grid-template-columns:34px 2.8em 1fr} .spacer{display:none} }
@media (prefers-reduced-motion:no-preference){ .s{transition:background-color .2s} }
</style>

<div class="wrap">
  <header class="top">
    <h1>Mr. God からの挑戦状 Level 1</h1>
    <p>音読シート Level 1　全20題　▶で1題ずつ再生／「連続再生」で20題を続けて聞けます</p>
  </header>

  <div class="bar" role="toolbar" aria-label="再生の操作">
    <select id="jump" aria-label="Levelへ移動" hidden></select>
    <button class="btn primary" id="playAll" type="button">連続再生</button>
    <button class="btn" id="stop" type="button">停止</button>
    <span class="seg" role="group" aria-label="再生速度" id="rate">
      <button type="button" data-r="0.75">0.75×</button><button type="button" data-r="0.9">0.9×</button><button type="button" data-r="1" aria-pressed="true">1×</button><button type="button" data-r="1.2">1.2×</button>
    </span>
    <span class="seg" role="group" aria-label="繰り返し回数" id="rep">
      <button type="button" data-n="1" aria-pressed="true">1回</button><button type="button" data-n="2">2回</button><button type="button" data-n="3">3回</button>
    </span>
    <span class="spacer"></span>
    <label class="tog"><input type="checkbox" id="hideEn"><span>英文を隠す</span></label>
    <input type="checkbox" id="hideJa" hidden>
    <div class="status" id="status" aria-live="polite">待機中</div>
  </div>

  <main id="list"></main>
  <p class="note">音声は合成音声です。「英文を隠す」にしているときは、英文をタップすると表示されます。</p>
</div>

<script>
const DATA = [{"no":1,"t":"Level 1","secs":[{"t":"No. 1–10","ex":[{"id":"1.","items":[["How a brief, casual stroll alters the various mental processes related to creativity remains unclear.","",[["How a brief, casual stroll alters the various mental processes related to creativity remains unclear.","A"]],1]]},{"id":"2.","items":[["The differences in the grammar of a language condition the way its speakers perceive reality.","",[["The differences in the grammar of a language condition the way its speakers perceive reality.","A"]],2]]},{"id":"3.","items":[["She had proclaimed that for there to be any hope for society, dreaming of new possibilities was absolutely necessary.","",[["She had proclaimed that for there to be any hope for society, dreaming of new possibilities was absolutely necessary.","A"]],3]]},{"id":"4.","items":[["Next time you board your plane, spare a little extra thought for your flight attendants, for they are the ones most responsible for you arriving at your destination safely after having had a great in-flight experience.","",[["Next time you board your plane, spare a little extra thought for your flight attendants, for they are the ones most responsible for you arriving at your destination safely after having had a great in-flight experience.","A"]],4]]},{"id":"5.","items":[["If an accident does happen, it may take a long time for emergency services to attend, thus increasing the chance that people will die at the scene or be left with permanent disabilities.","",[["If an accident does happen, it may take a long time for emergency services to attend, thus increasing the chance that people will die at the scene or be left with permanent disabilities.","A"]],5]]},{"id":"6.","items":[["There are no chairs in the cafeteria at one high school in central China. They disappeared during the summer so that students could store up a few precious extra minutes of study time. With the chairs gone, there was no risk of spending too much over lunch.","",[["There are no chairs in the cafeteria at one high school in central China. They disappeared during the summer so that students could store up a few precious extra minutes of study time. With the chairs gone, there was no risk of spending too much over lunch.","A"]],6]]},{"id":"7.","items":[["Crying is the only language newborn babies have to express their emotions, or feelings.","",[["Crying is the only language newborn babies have to express their emotions, or feelings.","A"]],7]]},{"id":"8.","items":[["Surveillance footage revealed by a local news outlet showed a man talking to the female victim and turning away, after which another man dashed toward her and punched her. The video also showed the attacker exchanging words with the victim's acquaintances, who rushed to her side after she fell to the ground.","",[["Surveillance footage revealed by a local news outlet showed a man talking to the female victim and turning away, after which another man dashed toward her and punched her. The video also showed the attacker exchanging words with the victim's acquaintances, who rushed to her side after she fell to the ground.","A"]],8]]},{"id":"9.","items":[["A 21-year-old man doing his compulsory military service remains unconscious for the sixth day since his suicide attempt on Sunday, which his family claimed was triggered by bullying from his superiors in the military.","",[["A 21-year-old man doing his compulsory military service remains unconscious for the sixth day since his suicide attempt on Sunday, which his family claimed was triggered by bullying from his superiors in the military.","A"]],9]]},{"id":"10.","items":[["The singer earned a huge amount of money through her concert, half of which she donated to charity.","",[["The singer earned a huge amount of money through her concert, half of which she donated to charity.","A"]],10]]}]},{"t":"No. 11–20","ex":[{"id":"11.","items":[["People, in fact, are more closely related to chimpanzees in terms of their DNA than the horse is to the zebra, the porpoise is to the dolphin, or the sheep is to the goat.","",[["People, in fact, are more closely related to chimpanzees in terms of their DNA than the horse is to the zebra, the porpoise is to the dolphin, or the sheep is to the goat.","A"]],11]]},{"id":"12.","items":[["The more people present when a person needs emergency help, the less likely it is any one of them will lend a hand.","",[["The more people present when a person needs emergency help, the less likely it is any one of them will lend a hand.","A"]],12]]},{"id":"13.","items":[["The more money I had, the more I spent and the more I lived in an anxious mood of always trying to make more.","",[["The more money I had, the more I spent and the more I lived in an anxious mood of always trying to make more.","A"]],13]]},{"id":"14.","items":[["The secret of influencing people lies not so much in being a good talker as in being a good listener.","",[["The secret of influencing people lies not so much in being a good talker as in being a good listener.","A"]],14]]},{"id":"15.","items":[["Some people now considered the greatest geniuses in history would have been diagnosed as autistic had they lived in the twenty-first century.","",[["Some people now considered the greatest geniuses in history would have been diagnosed as autistic had they lived in the twenty-first century.","A"]],15]]},{"id":"16.","items":[["Both male and female players receive a brain assessment before the season begins and will undergo follow-up examinations should they experience head injury.","",[["Both male and female players receive a brain assessment before the season begins and will undergo follow-up examinations should they experience head injury.","A"]],16]]},{"id":"17.","items":[["As we're surrounded by so much packaging nowadays, you might think it has always been there. Yet two hundred years ago, the average household in Western society produced almost no garbage as we understand it today.","",[["As we're surrounded by so much packaging nowadays, you might think it has always been there. Yet two hundred years ago, the average household in Western society produced almost no garbage as we understand it today.","A"]],17]]},{"id":"18.","items":[["Strange as it may seem, ice is the source of all life in Antarctica.","",[["Strange as it may seem, ice is the source of all life in Antarctica.","A"]],18]]},{"id":"19.","items":[["Not only is it important for children to learn when and where they were born, it also helps develop confidence and pride.","",[["Not only is it important for children to learn when and where they were born, it also helps develop confidence and pride.","A"]],19]]},{"id":"20.","items":[["Only when you can instantly recall what you understand, and practice using your remembered understanding, do you achieve.","",[["Only when you can instantly recall what you understand, and practice using your remembered understanding, do you achieve.","A"]],20]]}]}]}];
const PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';
const list=document.getElementById('list'), jump=document.getElementById('jump'), statusEl=document.getElementById('status');
const pad=n=>String(n).padStart(3,'0');
const order=[]; const rows={};
const tidy=s=>s.replace(/\s+([.,?!])/g,'$1').replace(/^\./,'');
DATA.forEach(ch=>{
  const opt=document.createElement('option'); opt.value='ch'+ch.no; opt.textContent=`${ch.t}`; jump.append(opt);
  const h=document.createElement('h2'); h.className='ch'; h.id='ch'+ch.no;
  h.innerHTML=`<span class="no">音読シート</span><span></span><button class="btn cplay" type="button" hidden></button>`;
  h.children[1].textContent=ch.t; list.append(h);
  const chNums=[];
  h.querySelector('.cplay').onclick=()=>startQueue(chNums,ch.t);
  ch.secs.forEach(g=>{
    const nums=[]; g.ex.forEach(e=>e.items.forEach(it=>nums.push(it[3])));
    if(!nums.length) return;
    const sec=document.createElement('section'); sec.className='grp';
    const gh=document.createElement('div'); gh.className='gh';
    gh.innerHTML='<span></span><button class="btn" type="button">まとめて再生</button>'; gh.firstChild.textContent=g.t;
    gh.querySelector('button').onclick=()=>startQueue(nums,g.t);
    const ol=document.createElement('ol'); ol.className='ss';
    g.ex.forEach(e=>e.items.forEach((it,ii)=>{
      const [en,ja,,n]=it;
      order.push(n); chNums.push(n);
      const li=document.createElement('li'); li.className='s'+(ii?' cont':''); li.id='s'+pad(n);
      const lab=ii?'':(e.id==='cf.'?'cf.':e.id);
      li.innerHTML=`<button class="play" type="button" aria-label="${e.id} ${ii+1}を再生">${PLAY}</button><span class="num"></span><span class="en"></span><span class="ja"></span>`;
      li.querySelector('.num').textContent=lab;
      li.querySelector('.en').textContent=tidy(en); li.querySelector('.ja').textContent=ja;
      li.querySelector('.play').onclick=()=>startQueue([n],`${ch.t} No.${e.id.replace(".","")}`);
      li.querySelector('.en').onclick=()=>li.classList.toggle('reveal-en');
      li.querySelector('.ja').onclick=()=>li.classList.toggle('reveal-ja');
      rows[n]=li; ol.append(li);
    }));
    sec.append(gh,ol); list.append(sec);
  });
});
jump.onchange=()=>document.getElementById(jump.value).scrollIntoView({behavior:'smooth'});

const SEG = {"1":[1,0.6,6.693],"2":[1,7.293,12.093],"3":[1,12.693,19.041],"4":[1,19.641,30.374],"5":[1,30.974,40.552],"6":[1,41.152,54.745],"7":[1,55.345,60.741],"8":[1,61.341,77.46],"9":[1,78.06,90.207],"10":[1,90.807,95.68],"11":[1,96.28,104.973],"12":[1,105.573,111.463],"13":[1,112.063,117.534],"14":[1,118.134,123.519],"15":[1,124.119,131.685],"16":[1,132.285,140.775],"17":[1,141.375,152.436],"18":[1,153.036,156.995],"19":[1,157.595,163.942],"20":[1,164.542,170.907]};
const audio=new Audio(); audio.preload='auto';
let rate=1, reps=1, queue=[], qi=0, rep=0, label='', cur=null, gapTimer=null, endAt=0, raf=0, loadedCh=0, token=0;
const setPressed=(grp,btn)=>grp.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===btn));
document.getElementById('rate').onclick=e=>{const b=e.target.closest('button'); if(!b)return; rate=+b.dataset.r; audio.playbackRate=rate; setPressed(e.currentTarget,b)};
document.getElementById('rep').onclick=e=>{const b=e.target.closest('button'); if(!b)return; reps=+b.dataset.n; setPressed(e.currentTarget,b)};
function mark(n){ if(cur) rows[cur].classList.remove('now'); cur=n; if(n){ rows[n].classList.add('now'); const r=rows[n].getBoundingClientRect(); if(r.top<160||r.bottom>innerHeight-40) rows[n].scrollIntoView({block:'center',behavior:'smooth'}); } }
function watch(my){ cancelAnimationFrame(raf); const tick=()=>{ if(my!==token) return; if(audio.currentTime>=endAt||audio.ended){ audio.pause(); onSegEnd(); return; } raf=requestAnimationFrame(tick); }; raf=requestAnimationFrame(tick); }
function playCur(){
  const n=queue[qi], my=++token; mark(n);
  const [ch,s,e]=SEG[n]; endAt=e+0.05;
  const msg=`再生中：${label}（${qi+1}/${queue.length}）${reps>1?`　${rep+1}/${reps}回目`:''}`; statusEl.textContent=msg;
  const go=()=>{ if(my!==token) return; statusEl.textContent=msg; audio.currentTime=Math.max(0,s-0.05); audio.playbackRate=rate; audio.play().then(()=>watch(my)).catch(()=>{statusEl.textContent='再生できませんでした。もう一度▶を押してください。'}); };
  if(loadedCh!==ch){ loadedCh=ch; audio.src='audio/L'+String(ch).padStart(2,'0')+'.mp3'; audio.addEventListener('loadedmetadata',go,{once:true}); audio.load(); statusEl.textContent='音声を読み込み中…'; }
  else go();
}
function startQueue(nums,lab){ clearTimeout(gapTimer); token++; audio.pause(); queue=nums; qi=0; rep=0; label=lab; playCur(); }
function stop(){ clearTimeout(gapTimer); token++; cancelAnimationFrame(raf); audio.pause(); queue=[]; mark(null); statusEl.textContent='停止しました'; }
function onSegEnd(){
  rep++;
  if(rep>=reps){ rep=0; qi++; }
  if(qi>=queue.length){ mark(null); statusEl.textContent=`再生終了：${label}`; queue=[]; return; }
  gapTimer=setTimeout(playCur, 700/rate + (rep>0?300:0));
}
audio.onerror=()=>{ if(queue.length) statusEl.textContent='音声を読み込めませんでした'; loadedCh=0; };
document.getElementById('stop').onclick=stop;
document.getElementById('playAll').onclick=()=>{
  // start from the chapter currently shown in the selector
  const no=+jump.value.slice(2); const i=order.indexOf(rows[order.find(n=>SEG[n][0]===no)]?order.find(n=>SEG[n][0]===no):order[0]);
  startQueue(order.slice(i), `Level ${no}から`);
};
const he=document.getElementById('hideEn'), hj=document.getElementById('hideJa');
he.onchange=()=>document.body.classList.toggle('hide-en',he.checked);
hj.onchange=()=>document.body.classList.toggle('hide-ja',hj.checked);
// keep chapter selector in sync with scroll
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) jump.value=e.target.id; }),{rootMargin:'-20% 0px -70% 0px'});
document.querySelectorAll('h2.ch').forEach(h=>io.observe(h));
</script>
